name: BC-C Invariants Gate

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main

jobs:
  invariants-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run invariant tests (BC / C contract)
        env:
          LUNA_INVARIANTS: DEBUG
        run: |
          python -m pytest tests/invariants \
                 tests/test_bc_c_cooperation_table.py \
                 tests/test_risk_layer_invariants.py \
                 tests/risk_layer \
                 tests/test_risk_bc_integration.py \
                 tests/test_authority_risk_hysteresis.py \
                 tests/test_debug_view.py \
                 tests/debug_view \
                 -v
      - name: Run debugdiff compare
        run: |
          EXIT_CODE=0
          python3 tools/debug/compare_runs.py \
            --baseline tests/debug_view/fixtures/baseline_debugview.jsonl \
            --candidate tests/debug_view/fixtures/candidate_debugview.jsonl \
            --out debug_diff_report.json \
            || EXIT_CODE=$?; \
          if [ "${EXIT_CODE}" = "3" ] || [ "${EXIT_CODE}" = "4" ]; then exit ${EXIT_CODE}; fi
      - name: Upload debugdiff artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debugdiff-report
          path: |
            tests/debug_view/fixtures/baseline_debugview.jsonl
            tests/debug_view/fixtures/candidate_debugview.jsonl
            debug_diff_report.json
  freeze-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run freeze tests (non-blocking)
        run: |
          python -m pytest tests/freeze -v
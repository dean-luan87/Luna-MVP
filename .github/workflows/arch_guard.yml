name: architecture-guard

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  arch-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run Architecture Guard + DCS
        run: |
          python3 tools/run_arch_guard.py --seconds 30

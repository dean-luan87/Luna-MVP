name: generate-viewer-artifact

on:
  workflow_run:
    workflows: ["arch-guard"]
    types:
      - completed

jobs:
  generate-artifact:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion != 'skipped' }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Download trace from arch-guard
        uses: actions/download-artifact@v4
        with:
          name: trace
          path: traces/
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: Generate Viewer Artifact
        run: |
          python3 tools/generate_viewer_artifact.py traces/b2_trace_v043.jsonl artifacts/
      
      - name: Upload Viewer Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-viewer
          path: artifacts/
          retention-days: 30

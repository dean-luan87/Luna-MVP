<html lang="zh-CN">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Luna 观察镜</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="luna-observation-lens" data-user-mode="simple">
  <div id="lol-app" class="lol-app">
    <header class="lol-top-bar" id="lol-top-bar" aria-label="任务栏">
      <div class="lol-top-brand">
        <h1 id="lol-title">Luna 观察镜</h1>
        <p class="lol-subtitle" id="lol-subtitle">查看 Luna 如何看见、标注、判断和解释当前画面</p>
      </div>
      <div class="lol-top-badges">
        <span class="badge badge-ok" id="lol-badge-candidate">候选结果</span>
        <span class="badge badge-warn" id="lol-badge-runtime">非运行态</span>
      </div>
      <div class="lol-top-actions">
        <label class="btn btn-secondary lol-file-btn">
          <span id="lol-select-file-label">选择文件</span>
          <input type="file" id="lol-file-input" accept="image/*,video/*" hidden />
        </label>
        <button type="button" id="lol-start-btn" class="btn btn-primary" disabled>开始观察</button>
        <div class="lol-view-toggle" role="tablist" aria-label="视图切换">
          <button type="button" class="lol-view-btn" data-view="original" role="tab">原图</button>
          <button type="button" class="lol-view-btn" data-view="compare" role="tab">普通对比</button>
          <button type="button" class="lol-view-btn active" data-view="hud" role="tab">机器人视角</button>
        </div>
        <label class="btn btn-ghost lol-json-btn">
          导入结果
          <input type="file" id="lol-json-input" accept=".json,application/json" hidden />
        </label>
        <button type="button" id="lol-advanced-btn" class="btn btn-ghost" aria-pressed="false">高级流程</button>
        <button type="button" id="lol-developer-btn" class="btn btn-ghost" aria-pressed="false">开发者</button>
      </div>
      <div class="lol-top-status">
        <span id="lol-service-status" class="lol-service-status" role="status">正在检查本地测试服务…</span>
        <button type="button" id="lol-recheck-service" class="btn btn-ghost btn-sm" hidden>重新检查服务</button>
        <span id="lol-load-status" class="load-status"></span>
      </div>
    </header>

    <div class="lol-main-grid">
      <aside class="lol-left-rail" id="lol-left-rail" aria-label="能力与输入"></aside>
      <main class="lol-central" id="lol-central" aria-label="主观察画面"></main>
      <aside class="lol-right-panel" id="lol-right-panel" aria-label="Luna 解释面板"></aside>
    </div>

    <div id="lol-object-chip-host" class="lol-object-chip-host" aria-label="识别对象胶囊条"></div>

    <footer class="lol-bottom-dock" id="lol-bottom-dock" aria-label="指标摘要与折叠面板"></footer>
  </div>

  <div id="advanced-workflow" class="lol-advanced-host" hidden>
    <div id="local-asset-import-host"></div>
    <div id="runner-bridge-host"></div>

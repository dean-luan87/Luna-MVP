<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>B2 v0.4.3 Gate Trace Viewer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", monospace;
      background: #0b0f14;
      color: #e6edf3;
      margin: 0;
      padding: 20px;
    }
    h2 {
      color: #60a5fa;
      margin-top: 0;
    }
    input[type="file"] {
      margin: 20px 0;
      padding: 10px;
      background: #121823;
      border: 1px solid #223044;
      border-radius: 8px;
      color: #e6edf3;
      cursor: pointer;
    }
    #out {
      margin-top: 20px;
    }
    .row {
      padding: 12px;
      border-bottom: 1px solid #223044;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .ACTIVE {
      background: rgba(74, 222, 128, 0.1);
      border-left: 3px solid #4ade80;
    }
    .READ_ONLY {
      background: rgba(255, 214, 92, 0.1);
      border-left: 3px solid #ffd65c;
    }
    .SUSPENDED {
      background: rgba(255, 92, 92, 0.1);
      border-left: 3px solid #ff5c5c;
      color: #ffaaaa;
    }
    .time {
      color: #9cf;
      font-weight: 600;
      min-width: 80px;
    }
    .gate-mode {
      font-weight: 700;
      min-width: 100px;
    }
    .reason {
      color: #9aa4ad;
      flex: 1;
    }
    .blocked-by {
      color: #ff5c5c;
      font-size: 12px;
    }
    .stats {
      margin: 20px 0;
      padding: 15px;
      background: #121823;
      border: 1px solid #223044;
      border-radius: 8px;
    }
    .stats-row {
      display: flex;
      gap: 20px;
      margin: 8px 0;
    }
    .stat-label {
      color: #9aa4ad;
      min-width: 120px;
    }
    .stat-value {
      color: #e6edf3;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h2>B2 Gate Trace Viewer (v0.4.3)</h2>
  <p style="color: #9aa4ad; font-size: 14px;">
    选择 <code>traces/b2_gate_trace_v042.jsonl</code> 文件查看 Gate 裁决历史
  </p>
  
  <input type="file" id="file" accept=".jsonl" />

  <div id="stats" class="stats" style="display: none;">
    <div class="stats-row">
      <span class="stat-label">总帧数:</span>
      <span class="stat-value" id="total-frames">-</span>
    </div>
    <div class="stats-row">
      <span class="stat-label">ACTIVE:</span>
      <span class="stat-value" id="active-count" style="color: #4ade80;">-</span>
    </div>
    <div class="stats-row">
      <span class="stat-label">READ_ONLY:</span>
      <span class="stat-value" id="readonly-count" style="color: #ffd65c;">-</span>
    </div>
    <div class="stats-row">
      <span class="stat-label">SUSPENDED:</span>
      <span class="stat-value" id="suspended-count" style="color: #ff5c5c;">-</span>
    </div>
  </div>

  <div id="out"></div>

  <script>
    document.getElementById("file").addEventListener("change", e => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        const lines = reader.result.trim().split("\n").filter(l => l.trim());
        const traces = [];
        const stats = { total: 0, ACTIVE: 0, READ_ONLY: 0, SUSPENDED: 0 };

        const out = document.getElementById("out");
        out.innerHTML = "";

        lines.forEach((l, idx) => {
          try {
            const j = JSON.parse(l);
            traces.push(j);
            stats.total++;
            
            const gateMode = j.gate_mode || "UNKNOWN";
            if (gateMode in stats) {
              stats[gateMode]++;
            }

            const div = document.createElement("div");
            div.className = "row " + gateMode;
            
            const ts = j.ts || j.frame_id || idx;
            const gateReason = j.gate_reason || j.gate?.human_readable || "";
            const blockedBy = j.gate?.blocked_by;

            div.innerHTML = `
              <span class="time">${typeof ts === 'number' ? ts.toFixed(2) + 's' : ts}</span>
              <span class="gate-mode">${gateMode}</span>
              <span class="reason">${gateReason}</span>
              ${blockedBy ? `<span class="blocked-by">⛔ ${blockedBy}</span>` : ""}
            `;
            out.appendChild(div);
          } catch (e) {
            console.error(`Line ${idx + 1} parse error:`, e);
          }
        });

        // 更新统计
        document.getElementById("stats").style.display = "block";
        document.getElementById("total-frames").textContent = stats.total;
        document.getElementById("active-count").textContent = stats.ACTIVE;
        document.getElementById("readonly-count").textContent = stats.READ_ONLY;
        document.getElementById("suspended-count").textContent = stats.SUSPENDED;
      };
      reader.readAsText(file);
    });
  </script>
</body>
</html>

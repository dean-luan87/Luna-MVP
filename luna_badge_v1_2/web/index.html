<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Luna Badge Realtime Nav Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <h1>Luna Badge v1.3.0 Realtime Nav</h1>

    <div class="top-row">
      <div class="video-block">
        <video id="video" autoplay playsinline></video>
        <canvas id="overlay"></canvas>
      </div>

      <div class="stats-block">
        <h2>实时指标</h2>
        <ul>
          <li>状态：<span id="status" class="status-dot">初始化中...</span></li>
          <li>每帧延迟：<span id="latency">-</span> ms</li>
          <li>平均延迟：<span id="avgLatency">-</span> ms</li>
          <li>FPS：<span id="fps">-</span></li>
          <li>总帧数：<span id="frameCount">0</span></li>
          <li>最后检测框数：<span id="boxCount">0</span></li>
        </ul>

        <div class="controls">
          <label>发送间隔 (ms):
            <input id="intervalInput" type="number" value="300" min="100" step="50" />
          </label>
          <button id="startBtn">开始</button>
          <button id="stopBtn" disabled>停止</button>
        </div>
      </div>
    </div>

    <div class="logs-block">
      <h2>日志</h2>
      <pre id="log"></pre>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket 快速测试</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #0f0;
        }
        #output {
            background: #000;
            padding: 15px;
            border: 1px solid #0f0;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
        }
        .log { margin: 5px 0; }
        .success { color: #0f0; }
        .error { color: #f00; }
        .info { color: #0ff; }
    </style>
</head>
<body>
    <h1>🔍 WebSocket 快速测试</h1>
    <div id="output"></div>
    
    <script>
        function log(msg, type = 'info') {
            const output = document.getElementById('output');
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
            console.log(msg);
        }
        
        // 获取当前主机和协议
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const host = window.location.hostname;
        const wsPort = window.location.protocol === 'https:' ? '' : ':8900';
        const wsPath = window.location.protocol === 'https:' ? '/ws/' : '';
        const wsUrl = `${protocol}//${host}${wsPort}${wsPath}`;
        
        log(`准备连接: ${wsUrl}`, 'info');
        
        const ws = new WebSocket(wsUrl);
        
        ws.onopen = () => {
            log('✅ CONNECTED', 'success');
            // 2秒后发送测试消息
            setTimeout(() => {
                ws.send('hello');
                log('📤 发送: hello', 'info');
            }, 2000);
        };
        
        ws.onmessage = (msg) => {
            log(`📥 RECV: ${msg.data}`, 'success');
        };
        
        ws.onerror = (e) => {
            log(`❌ ERROR: ${e}`, 'error');
        };
        
        ws.onclose = (e) => {
            log(`🔌 CLOSED: code=${e.code}, reason=${e.reason || '无'}`, 'error');
            if (e.code === 1011) {
                log('⚠️  错误码 1011: 服务器内部错误', 'error');
            }
        };
    </script>
</body>
</html>

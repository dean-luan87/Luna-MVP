[pytest]
# pytest 配置文件
testpaths = tests/qa_1_4_1
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 标记
markers =
    slow: 慢速测试（需要较长时间）
    long_running: 长时间运行测试（需要 1 小时以上）
    requires_camera: 需要摄像头
    requires_gpu: 需要 GPU

# 输出选项
addopts = 
    -v
    --tb=short
    --strict-markers

# 日志
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

















<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Luna Realtime H5 Lab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h2>Luna Badge v1.3.1 — 实时视觉测试 (H5)</h2>

  <div id="video-container">
    <video id="camera" autoplay playsinline></video>
    <canvas id="captureCanvas"></canvas>
    <canvas id="overlay"></canvas>
  </div>

  <div id="status-panel">
    <p>连接状态：<span id="connStatus">Disconnected</span></p>
    <p>当前模型：<span id="modelName">loading...</span></p>
    <p>FPS：<span id="fps">0</span></p>
    <p>推理延迟：<span id="latency">-</span> ms</p>
    <p>上行速率：<span id="uploadRate">-</span> KB/s</p>
    <p>下行速率：<span id="downloadRate">-</span> KB/s</p>
    <p>最近结果：</p>
    <pre id="resultText"></pre>
  </div>

  <script src="camera.js"></script>
  <script src="overlay.js"></script>
  <script src="metrics.js"></script>
  <script src="ws_client.js"></script>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Luna Badge - 实时推理测试 (H5)</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container">
        <h2>Luna Badge — 实时摄像头测试 (H5)</h2>

        <!-- 连接状态 -->
        <div class="status-bar">
            <span id="connStatus" class="status disconnected">未连接</span>
            <span id="protocolVersion" class="badge">协议: 1.0.0</span>
        </div>

        <!-- 视频容器 -->
        <div id="video-container">
            <video id="camera" autoplay playsinline muted></video>
            <canvas id="captureCanvas"></canvas>
            <canvas id="overlay"></canvas>
        </div>

        <!-- 性能指标面板 -->
        <div id="statusPanel" class="panel">
            <div class="metric-row">
                <label>FPS</label>
                <span id="fps" class="value">0</span>
            </div>
            <div class="metric-row">
                <label>端到端延迟</label>
                <span id="latency" class="value">-</span> <span class="unit">ms</span>
            </div>
            <div class="metric-row">
                <label>推理时间</label>
                <span id="inferTime" class="value">-</span> <span class="unit">ms</span>
            </div>
            <div class="metric-row">
                <label>导航时间</label>
                <span id="navTime" class="value">-</span> <span class="unit">ms</span>
            </div>
            <div class="metric-row">
                <label>网络 RTT</label>
                <span id="rtt" class="value">-</span> <span class="unit">ms</span>
            </div>
            <div class="metric-row">
                <label>上行流量</label>
                <span id="uploadRate" class="value">-</span> <span class="unit">KB/s</span>
            </div>
            <div class="metric-row">
                <label>下行流量</label>
                <span id="downloadRate" class="value">-</span> <span class="unit">KB/s</span>
            </div>
            <div class="metric-row">
                <label>已发送帧数</label>
                <span id="frameCount" class="value">0</span>
            </div>
        </div>

        <!-- 推理结果 -->
        <div id="resultPanel" class="panel">
            <h3>推理结果</h3>
            <div id="resultText" class="result-text"></div>
            <div id="navResult" class="nav-result"></div>
        </div>

        <!-- 控制按钮 -->
        <div class="controls">
            <button id="btnConnect" class="btn btn-primary">连接服务器</button>
            <button id="btnStartCamera" class="btn btn-secondary">启动相机</button>
        </div>
    </div>

    <script src="camera.js"></script>
    <script src="overlay.js"></script>
    <script src="metrics.js"></script>
    <script src="ws_client.js"></script>
    <script src="app.js"></script>
</body>
</html>

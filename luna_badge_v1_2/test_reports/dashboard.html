<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <title>Luna Badge A-Z 测试仪表盘</title>
    <style>
      body { 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
        padding: 20px; 
        background: #f5f5f5;
        margin: 0;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }
      h1 { 
        border-bottom: 2px solid #2196F3; 
        padding-bottom: 10px; 
        color: #1976D2;
        margin-top: 0;
      }
      h2 {
        color: #424242;
        margin-top: 30px;
        border-left: 4px solid #2196F3;
        padding-left: 10px;
      }
      .card { 
        border: 1px solid #e0e0e0; 
        border-radius: 8px; 
        padding: 20px; 
        margin-bottom: 20px;
        background: #fafafa;
      }
      .ok { color: #2e7d32; font-weight: bold; }
      .fail { color: #c62828; font-weight: bold; }
      .warn { color: #f57c00; font-weight: bold; }
      table { 
        border-collapse: collapse; 
        width: 100%; 
        margin-top: 10px;
      }
      th, td { 
        border: 1px solid #e0e0e0; 
        padding: 10px 12px; 
        font-size: 14px; 
        text-align: left;
      }
      th { 
        background: #2196F3; 
        color: white;
        font-weight: 600;
      }
      tr:nth-child(even) { background: #f9f9f9; }
      tr:hover { background: #f0f0f0; }
      .status-badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: bold;
      }
      .status-pass {
        background: #4caf50;
        color: white;
      }
      .status-fail {
        background: #f44336;
        color: white;
      }
      .status-timeout {
        background: #ff9800;
        color: white;
      }
      .status-error {
        background: #9e9e9e;
        color: white;
      }
      .metric {
        display: inline-block;
        margin: 10px 20px 10px 0;
        padding: 10px 15px;
        background: #e3f2fd;
        border-radius: 6px;
        border-left: 4px solid #2196F3;
      }
      .metric-label {
        font-size: 12px;
        color: #666;
        display: block;
      }
      .metric-value {
        font-size: 24px;
        font-weight: bold;
        color: #1976D2;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        padding: 8px 0;
        border-bottom: 1px solid #eee;
      }
      .timestamp {
        color: #666;
        font-size: 14px;
        margin-bottom: 20px;
      }
    </style>
</head>
<body>
    <div class="container">
<h1>🚀 Luna Badge A-Z 测试仪表盘</h1><p class='timestamp'>生成时间：2025-11-28 10:17:08</p><div class='card'><h2>📊 环境概况</h2><p class='warn'>⚠️ 暂无环境报告，请先运行 <code>environment_diagnostics.py</code></p></div><div class='card'><h2>✅ A-Z 单元测试结果</h2><p class='warn'>⚠️ 暂无 summary.json，请先运行 <code>test_all_AZ.py</code></p></div><div class='card'><h2>🔥 压力测试（Stress Test）</h2><p class='warn'>⚠️ 暂无 stress_report.json，请先运行 <code>stress_test_AZ.py</code></p></div>
    </div>
</body>
</html>

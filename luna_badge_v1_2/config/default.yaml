# Luna Badge 默认配置文件
# 所有环境的基础配置

env: dev

# 日志配置
logging:
  level: INFO
  file_path: logs/runtime.log
  max_bytes: 5242880  # 5MB
  backup_count: 5

# 并发配置
concurrency:
  default_worker_threads: 4

# 指标配置
metrics:
  enable: true

# 系统配置
system:
  camera:
    enabled: true
    index: 0  # 摄像头索引
    fps_limit: 20  # 帧率限制
  vision:
    infer_interval: 0.1  # 推理间隔（秒），默认 0.1 秒（10 FPS）
  sensors:
    enabled: true

# Speed Engine 配置
speed:
  model_switcher:
    heavy_to_light_ms: 80  # heavy 模型平均延迟超过此值切换到 light
    light_to_heavy_ms: 40  # light 模型平均延迟低于此值切换回 heavy
    min_samples: 5  # 切换前需要的最小样本数

# FailSafe 应急保障配置
failsafe:
  health_monitor:
    camera_timeout: 0.5  # 摄像头超时时间（秒）
    infer_timeout: 0.8  # 推理超时时间（秒）
    heartbeat_timeout: 1.2  # 心跳超时时间（秒）
    cpu_threshold: 80.0  # CPU 使用率阈值（%）
    mem_threshold: 85.0  # 内存使用率阈值（%）
    check_interval: 0.1  # 检查间隔（秒）
  recovery:
    enabled: true  # 是否启用自动恢复
    stable_duration_sec: 15  # 连续稳定时间（秒）才允许恢复
    check_interval_sec: 1  # 恢复检查周期（秒）
    auto_restart_enabled: false  # v1 默认不自动重启线程，仅恢复模式


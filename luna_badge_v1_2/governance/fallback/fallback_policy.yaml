# Fallback Policy Configuration
# 兜底策略配置
#
# v1.5 设计原则：
# - PlanB 不追求聪明，只追求不死
# - PlanB 不做自动学习，只执行写好的策略
# - PlanB 是 v1.5 可靠性的核心锚点
#
# 策略结构说明：
# - trigger: 触发原因（来自 MOC 的 decision.reason）
# - plan: 只是标签（方便理解），如 B1/B2/B3
# - action: 真正执行的动作（switch_model/degrade_capability/cross_domain/abort）
# - target: 动作目标（模型ID、能力名称等）
# - exhausted: 系统级 trigger（自动触发，当达到 max_attempts 时）

task_domains:
  navigation:
    max_attempts: 3
    cooldown_ms: 2000
    
    rules:
      # B1: 同域模型替换
      - trigger: low_confidence
        plan: B1
        action: switch_model
        target: backup_vision_model
        description: "主模型置信度低，切换到备用视觉模型"
      
      - trigger: model_failure
        plan: B1
        action: switch_model
        target: backup_vision_model
        description: "主模型失败，切换到备用视觉模型"
      
      # B2: 同域能力降级
      - trigger: conflict
        plan: B2
        action: degrade_capability
        target: basic_navigation
        description: "模型冲突，降级到基础导航能力"
      
      - trigger: invalid_output
        plan: B2
        action: degrade_capability
        target: basic_navigation
        description: "输出无效，降级到基础导航能力"
      
      # B3: 跨域替代
      - trigger: timeout
        plan: B3
        action: cross_domain
        target: voice_guidance
        description: "视觉超时，切换到语音引导"
      
      # 中止
      - trigger: exhausted
        plan: abort
        action: abort_task
        target: null
        description: "达到最大尝试次数，中止任务"

  safety:
    max_attempts: 2
    cooldown_ms: 1000
    
    rules:
      - trigger: low_confidence
        plan: B1
        action: switch_model
        target: backup_safety_model
        description: "安全模型置信度低，切换到备用安全模型"
      
      - trigger: model_failure
        plan: B1
        action: switch_model
        target: backup_safety_model
        description: "安全模型失败，切换到备用安全模型"
      
      - trigger: conflict
        plan: B2
        action: degrade_capability
        target: basic_safety_check
        description: "安全模型冲突，降级到基础安全检查"
      
      - trigger: exhausted
        plan: abort
        action: abort_task
        target: null
        description: "达到最大尝试次数，中止安全任务"

  inquiry:
    max_attempts: 3
    cooldown_ms: 3000
    
    rules:
      - trigger: low_confidence
        plan: B1
        action: switch_model
        target: backup_llm_model
        description: "LLM 置信度低，切换到备用 LLM 模型"
      
      - trigger: invalid_output
        plan: B1
        action: switch_model
        target: backup_llm_model
        description: "LLM 输出无效，切换到备用 LLM 模型"
      
      - trigger: timeout
        plan: B2
        action: degrade_capability
        target: keyword_matching
        description: "LLM 超时，降级到关键词匹配"
      
      - trigger: exhausted
        plan: abort
        action: abort_task
        target: null
        description: "达到最大尝试次数，中止查询任务"

  # 默认策略（当 task_domain 未匹配时使用）
  default:
    max_attempts: 2
    cooldown_ms: 2000
    
    rules:
      - trigger: model_failure
        plan: B1
        action: switch_model
        target: null
        description: "默认模型替换"
      
      - trigger: exhausted
        plan: abort
        action: abort_task
        target: null
        description: "达到最大尝试次数，中止任务"






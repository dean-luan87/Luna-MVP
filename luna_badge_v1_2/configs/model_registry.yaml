# configs/model_registry.yaml

current_nav_model: yolo11_nav_tiny

models:
  # 主导航检测模型：YOLO11 tiny (PyTorch)
  yolo11_nav_tiny:
    path: models/nav/yolo11_tiny.pt   # 注意：下面会说明如何移动文件
    role: primary_nav
    framework: pytorch
    input_size: [640, 640]
    stride: 32
    confidence_threshold: 0.25
    iou_threshold: 0.45
    max_detections: 100
    device: auto

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Luna Badge 实时导航测试</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui;
      background: #0b1020;
      color: #f5f5f5;
    }
    .container {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card {
      background: #151b2f;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.35);
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .row label {
      opacity: 0.7;
    }
    .value {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      border-radius: 999px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      color: #0b1020;
      background: #4ade80;
      box-shadow: 0 4px 10px rgba(74, 222, 128, 0.5);
    }
    .btn[disabled] {
      opacity: 0.4;
      box-shadow: none;
    }
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      margin-right: 6px;
    }
    .status-dot.ok {
      background: #22c55e;
    }
    .status-dot.warn {
      background: #eab308;
    }
    .status-dot.err {
      background: #ef4444;
    }
    video, canvas {
      width: 100%;
      border-radius: 12px;
      background: #000;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      background: rgba(148,163,184,0.18);
      margin-left: 8px;
    }
    .badge span {
      font-variant-numeric: tabular-nums;
    }
    .log {
      font-size: 11px;
      max-height: 140px;
      overflow-y: auto;
      white-space: pre-line;
      font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
  </style>
</head>
<body>
<div class="container">

  <!-- 连接与模式控制 -->
  <div class="card">
    <div class="row">
      <div>
        <span id="connStatusDot" class="status-dot err"></span>
        <span id="connStatusText">未连接</span>
      </div>
      <button id="btnConnect" class="btn">连接服务器</button>
    </div>
    <div class="row">
      <label>服务器地址</label>
      <div class="value" style="font-size: 12px;" id="serverUrlLabel"></div>
    </div>
    <div class="row">
      <label>连续导航模式</label>
      <div>
        <input type="checkbox" id="autoModeToggle" checked />
        <span style="font-size: 12px; opacity: 0.8;">每 200ms 自动抓取并发送一帧</span>
      </div>
    </div>
  </div>

  <!-- 视频预览 -->
  <div class="card">
    <div class="row">
      <div>相机预览</div>
      <div class="badge">camera <span id="camStatusLabel">&nbsp;未启动</span></div>
    </div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>
  </div>

  <!-- 性能指标 -->
  <div class="card">
    <div class="row">
      <label>端到端延迟 (P95 实时)</label>
      <div class="value"><span id="latencyLabel">-</span> ms</div>
    </div>
    <div class="row">
      <label>最近一帧 RTT</label>
      <div class="value"><span id="rttLabel">-</span> ms</div>
    </div>
    <div class="row">
      <label>YOLO 推理时间</label>
      <div class="value"><span id="inferLabel">-</span> ms</div>
    </div>
    <div class="row">
      <label>导航决策时间</label>
      <div class="value"><span id="navLabel">-</span> ms</div>
    </div>
    <div class="row">
      <label>当前 FPS</label>
      <div class="value"><span id="fpsLabel">0</span> fps</div>
    </div>
    <div class="row">
      <label>发送帧总数</label>
      <div class="value"><span id="frameCountLabel">0</span></div>
    </div>
  </div>

  <!-- 心跳与 WS 状态 -->
  <div class="card">
    <div class="row">
      <label>心跳序号</label>
      <div class="value"><span id="hbSeqLabel">0</span></div>
    </div>
    <div class="row">
      <label>最近心跳延迟</label>
      <div class="value"><span id="hbRttLabel">-</span> ms</div>
    </div>
    <div class="row">
      <label>上次心跳时间</label>
      <div class="value"><span id="hbTimeLabel">-</span></div>
    </div>
    <div class="row">
      <label>重连次数</label>
      <div class="value"><span id="reconnectCountLabel">0</span></div>
    </div>
  </div>

  <!-- 简单日志 -->
  <div class="card">
    <div class="row">
      <div>运行日志</div>
      <div class="badge">最近 50 条</div>
    </div>
    <div id="log" class="log"></div>
  </div>

</div>

<script>
  // ======== 基础配置（自动适配当前页面协议和端口） ========
  const PROTOCOL_VERSION = "1.0.0"; // Luna Badge 协议版本
  const protocol = window.location.protocol === "https:" ? "wss" : "ws";
  const SERVER_HOST = window.location.hostname || "10.183.232.224";
  const SERVER_PORT = window.location.port || "8899";
  const WS_PATH = "/ws_json";  // 使用现有的 WebSocket 路径
  const SERVER_WS_URL = `${protocol}://${SERVER_HOST}:${SERVER_PORT}${WS_PATH}`;

  // 自动帧发送间隔（连续导航模式），单位 ms
  const FRAME_INTERVAL_MS = 200;
  // 心跳间隔，单位 ms
  const HEARTBEAT_INTERVAL_MS = 3000;
  // 最多重连间隔
  const RECONNECT_MAX_DELAY_MS = 10000;

  // ======== DOM ========
  const videoEl = document.getElementById("video");
  const canvasEl = document.getElementById("canvas");
  const btnConnect = document.getElementById("btnConnect");
  const autoModeToggle = document.getElementById("autoModeToggle");

  const connStatusDot = document.getElementById("connStatusDot");
  const connStatusText = document.getElementById("connStatusText");
  const camStatusLabel = document.getElementById("camStatusLabel");
  const serverUrlLabel = document.getElementById("serverUrlLabel");

  const latencyLabel = document.getElementById("latencyLabel");
  const rttLabel = document.getElementById("rttLabel");
  const inferLabel = document.getElementById("inferLabel");
  const navLabel = document.getElementById("navLabel");
  const fpsLabel = document.getElementById("fpsLabel");
  const frameCountLabel = document.getElementById("frameCountLabel");
  const hbSeqLabel = document.getElementById("hbSeqLabel");
  const hbRttLabel = document.getElementById("hbRttLabel");
  const hbTimeLabel = document.getElementById("hbTimeLabel");
  const reconnectCountLabel = document.getElementById("reconnectCountLabel");
  const logEl = document.getElementById("log");

  serverUrlLabel.textContent = SERVER_WS_URL;

  // ======== 状态变量 ========
  let ws = null;
  let wsConnected = false;
  let reconnectAttempts = 0;
  let reconnectTimer = null;

  let frameId = 0;
  let totalFramesSent = 0;
  let lastFrameSentAt = 0;
  let fpsCounter = 0;
  let fpsTimer = null;

  let autoFrameTimer = null;
  let hbTimer = null;
  let hbSeq = 0;
  let lastHbSentAt = 0;

  // GPS 位置（可选）
  let lastGPS = null;
  let gpsWatchId = null;

  // 用于 P95 估计的延迟数组（只保留最近 N 条）
  const latencySamples = [];
  const LAT_SAMPLE_MAX = 200;

  // ======== 网络类型检测 ========
  function getNetworkType() {
    if (navigator.connection) {
      const conn = navigator.connection;
      if (conn.effectiveType === "4g") return "4g";
      if (conn.effectiveType === "5g" || conn.type === "cellular" && conn.downlink > 10) return "5g";
      if (conn.type === "wifi") return "wifi";
    }
    return "other";
  }

  // ======== GPS 定位（可选） ========
  function startGPS() {
    if (!navigator.geolocation) return;
    gpsWatchId = navigator.geolocation.watchPosition(
      (pos) => {
        lastGPS = {
          lat: pos.coords.latitude,
          lon: pos.coords.longitude,
          accuracy: pos.coords.accuracy
        };
      },
      (err) => {
        console.warn("GPS 定位失败:", err);
      },
      { enableHighAccuracy: true, maximumAge: 5000 }
    );
  }

  function stopGPS() {
    if (gpsWatchId !== null) {
      navigator.geolocation.clearWatch(gpsWatchId);
      gpsWatchId = null;
    }
  }

  // 收到的 RTT 统计
  function addLatencySample(ms) {
    if (!isFinite(ms)) return;
    latencySamples.push(ms);
    if (latencySamples.length > LAT_SAMPLE_MAX) {
      latencySamples.shift();
    }
    if (latencySamples.length >= 5) {
      const sorted = [...latencySamples].sort((a, b) => a - b);
      const idx95 = Math.floor(sorted.length * 0.95) - 1;
      const p95 = sorted[Math.max(idx95, 0)];
      latencyLabel.textContent = p95.toFixed(1);
    }
  }

  function setConnStatus(status, text) {
    connStatusDot.classList.remove("ok", "warn", "err");
    if (status === "ok") connStatusDot.classList.add("ok");
    else if (status === "warn") connStatusDot.classList.add("warn");
    else connStatusDot.classList.add("err");
    connStatusText.textContent = text;
  }

  function appendLog(msg) {
    const ts = new Date().toLocaleTimeString();
    const line = `[${ts}] ${msg}\n`;
    logEl.textContent = line + logEl.textContent;
    const lines = logEl.textContent.split("\n");
    if (lines.length > 50) {
      logEl.textContent = lines.slice(0, 50).join("\n");
    }
  }

  // ======== 相机控制 ========
  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "environment",
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });
      videoEl.srcObject = stream;
      camStatusLabel.textContent = " 已启动";
      appendLog("相机启动成功");
    } catch (err) {
      console.error(err);
      camStatusLabel.textContent = " 启动失败";
      appendLog("相机启动失败: " + err.message);
      alert("相机权限被拒绝或无法启动，请在 iOS 设置中允许访问相机。");
    }
  }

  function stopCamera() {
    const stream = videoEl.srcObject;
    if (stream && stream.getTracks) {
      stream.getTracks().forEach(t => t.stop());
    }
    videoEl.srcObject = null;
    camStatusLabel.textContent = " 未启动";
    appendLog("相机已停止");
  }

  // ======== WebSocket 连接管理 ========
  function connectWS() {
    if (wsConnected || ws) return;

    appendLog("开始连接 WebSocket: " + SERVER_WS_URL);
    setConnStatus("warn", "正在连接…");

    try {
      ws = new WebSocket(SERVER_WS_URL);
    } catch (e) {
      appendLog("创建 WebSocket 失败: " + e.message);
      setConnStatus("err", "创建连接失败");
      scheduleReconnect();
      return;
    }

    ws.onopen = () => {
      wsConnected = true;
      reconnectAttempts = 0;
      reconnectCountLabel.textContent = "0";
      setConnStatus("ok", "已连接");
      appendLog("WebSocket 连接成功");

      // 记录连接事件
      logEvent({
        event: "ws_connect",
        protocol_version: PROTOCOL_VERSION
      });

      btnConnect.textContent = "断开连接";
      btnConnect.disabled = false;

      // 启动 GPS（可选）
      startGPS();

      // 启动自动帧发送
      if (autoModeToggle.checked) {
        startAutoFrameLoop();
      }
      // 启动心跳
      startHeartbeatLoop();
      // 启动 FPS 统计
      startFpsCounter();
    };

    ws.onmessage = (event) => {
      let data;
      try {
        data = JSON.parse(event.data);
      } catch (e) {
        appendLog("收到非 JSON 消息");
        return;
      }

      // ======== HeartbeatSpec: heartbeat_ack ========
      if (data.type === "heartbeat_ack") {
        const now = performance.now();
        const rtt = now - (data.client_ts || now);
        hbSeqLabel.textContent = String(data.seq || hbSeq);
        hbRttLabel.textContent = rtt.toFixed(1);
        hbTimeLabel.textContent = new Date().toLocaleTimeString();
        logEvent({
          event: "heartbeat_ack",
          seq: data.seq,
          rtt_ms: rtt
        });
      }
      // ======== InferSpec: infer_result ========
      else if (data.type === "infer_result") {
        const tClientRecv = performance.now();
        const clientSendTs = data.client_ts; // 原样回显的客户端时间戳
        const serverInferStartTs = data.server_ts;
        const serverInferEndTs = data.infer_ts;
        const serverNavEndTs = data.nav_ts;
        const serverSendTs = data.ts_server_send || tClientRecv;

        // 计算各种延迟
        const endToEndMs = tClientRecv - clientSendTs;
        const uploadMs = serverInferStartTs - clientSendTs;
        const downloadMs = tClientRecv - serverSendTs;
        const rttMs = uploadMs + downloadMs;

        // 更新 UI
        latencyLabel.textContent = endToEndMs.toFixed(1);
        rttLabel.textContent = rttMs.toFixed(1);
        inferLabel.textContent = data.infer_ms != null ? data.infer_ms.toFixed(1) : "-";
        navLabel.textContent = data.nav_ms != null ? data.nav_ms.toFixed(1) : "-";
        addLatencySample(endToEndMs);

        // 显示导航信息（如果有）
        if (data.nav) {
          const dangerLevel = data.nav.danger_level || 0;
          const decision = data.nav.decision || "unknown";
          appendLog(`导航: ${data.nav.text || decision}, 危险等级: ${dangerLevel}`);
        }

        // 记录性能日志
        logEvent({
          event: "infer_result",
          frame_id: data.frame_id,
          network: {
            rtt_ms: rttMs,
            upload_ms: uploadMs,
            download_ms: downloadMs
          },
          infer: {
            infer_ms: data.infer_ms || 0,
            nav_ms: data.nav_ms || 0,
            total_ms: data.total_ms || 0
          },
          end_to_end_ms: endToEndMs
        });
      }
      // ======== ErrorSpec: error ========
      else if (data.type === "error") {
        appendLog(`[错误] ${data.code}: ${data.message}`);
        if (data.detail) appendLog(`详情: ${data.detail}`);
        logEvent({
          event: "error",
          code: data.code,
          message: data.message,
          detail: data.detail
        });
      }
      else if (data.type === "log") {
        appendLog("[server] " + data.message);
      }
    };

    ws.onclose = () => {
      wsConnected = false;
      appendLog("WebSocket 已关闭");
      setConnStatus("err", "已断开");
      btnConnect.textContent = "连接服务器";
      
      // 记录断开事件
      logEvent({
        event: "ws_disconnect"
      });

      // 停止 GPS
      stopGPS();

      stopAutoFrameLoop();
      stopHeartbeatLoop();
      stopFpsCounter();
      scheduleReconnect();
    };

    ws.onerror = (err) => {
      console.error("WebSocket error", err);
      appendLog("WebSocket 错误");
    };
  }

  function scheduleReconnect() {
    if (reconnectTimer) return;
    reconnectAttempts += 1;
    reconnectCountLabel.textContent = String(reconnectAttempts);
    const delay = Math.min(RECONNECT_MAX_DELAY_MS, 1000 * reconnectAttempts);
    appendLog("计划重连，延迟 " + delay + " ms");
    reconnectTimer = setTimeout(() => {
      reconnectTimer = null;
      if (!wsConnected) {
        connectWS();
      }
    }, delay);
  }

  function disconnectWS(manual = false) {
    if (reconnectTimer) {
      clearTimeout(reconnectTimer);
      reconnectTimer = null;
    }
    if (ws) {
      const w = ws;
      ws = null;
      w.close();
    }
    wsConnected = false;
    stopAutoFrameLoop();
    stopHeartbeatLoop();
    stopFpsCounter();
    setConnStatus("err", manual ? "已手动断开" : "已断开");
    btnConnect.textContent = "连接服务器";
  }

  // ======== 心跳（HeartbeatSpec 完整实现） ========
  function startHeartbeatLoop() {
    if (hbTimer) return;
    hbTimer = setInterval(() => {
      if (!wsConnected || !ws || ws.readyState !== WebSocket.OPEN) return;
      hbSeq += 1;
      const now = performance.now();
      lastHbSentAt = now;
      // HeartbeatSpec 规范
      const payload = {
        type: "heartbeat",
        protocol_version: PROTOCOL_VERSION,
        seq: hbSeq,
        client_ts: now
      };
      ws.send(JSON.stringify(payload));
      logEvent({
        event: "heartbeat",
        seq: hbSeq,
        client_ts: now
      });
    }, HEARTBEAT_INTERVAL_MS);
  }

  function stopHeartbeatLoop() {
    if (hbTimer) {
      clearInterval(hbTimer);
      hbTimer = null;
    }
  }

  // ======== 自动帧发送 ========
  function startAutoFrameLoop() {
    if (autoFrameTimer) return;
    if (!videoEl.srcObject) {
      appendLog("相机未启动，先尝试启动相机…");
      startCamera();
    }
    appendLog("启动连续导航模式（自动帧发送）");
    autoFrameTimer = setInterval(() => {
      if (!wsConnected || !ws || ws.readyState !== WebSocket.OPEN) return;
      sendSingleFrame();
    }, FRAME_INTERVAL_MS);
  }

  function stopAutoFrameLoop() {
    if (autoFrameTimer) {
      clearInterval(autoFrameTimer);
      autoFrameTimer = null;
      appendLog("已停止连续导航模式");
    }
  }

  function sendSingleFrame() {
    if (!videoEl.srcObject) return;
    const width = videoEl.videoWidth || 640;
    const height = videoEl.videoHeight || 480;
    if (!width || !height) return;

    canvasEl.width = width;
    canvasEl.height = height;
    const ctx = canvasEl.getContext("2d");
    ctx.drawImage(videoEl, 0, 0, width, height);

    const dataUrl = canvasEl.toDataURL("image/jpeg", 0.6);
    const base64Data = dataUrl.split(",")[1];

    const now = performance.now();
    frameId += 1;
    totalFramesSent += 1;
    lastFrameSentAt = now;
    fpsCounter += 1;

    frameCountLabel.textContent = String(totalFramesSent);

    // ======== FrameSpec 完整实现 ========
    const payload = {
      type: "frame",
      protocol_version: PROTOCOL_VERSION,
      frame_id: frameId, // 整数，不是字符串
      client_ts: now,
      width: width,
      height: height,
      image_base64: base64Data,
      meta: {
        platform: /iPhone|iPad|iPod/.test(navigator.userAgent) ? "ios" : 
                 /Android/.test(navigator.userAgent) ? "android" : "web",
        user_agent: navigator.userAgent,
        auto_mode: autoModeToggle.checked,
        camera_facing: "rear", // 后置摄像头
        network: getNetworkType(),
        gps: lastGPS || undefined // 可选字段
      }
    };

    // 记录事件日志
    logEvent({
      event: "frame_sent",
      frame_id: frameId,
      client_ts: now
    });

    try {
      ws.send(JSON.stringify(payload));
    } catch (e) {
      appendLog("发送帧失败: " + e.message);
      logEvent({
        event: "error",
        code: "WS-002",
        message: "WS 发送数据失败",
        detail: e.message
      });
    }
  }

  // ======== FPS 统计 ========
  function startFpsCounter() {
    if (fpsTimer) return;
    fpsTimer = setInterval(() => {
      fpsLabel.textContent = String(fpsCounter);
      fpsCounter = 0;
    }, 1000);
  }

  function stopFpsCounter() {
    if (fpsTimer) {
      clearInterval(fpsTimer);
      fpsTimer = null;
    }
    fpsLabel.textContent = "0";
  }

  // ======== 事件绑定 ========
  btnConnect.addEventListener("click", async () => {
    if (!wsConnected) {
      btnConnect.disabled = true;
      await startCamera();
      connectWS();
      btnConnect.disabled = false;
    } else {
      disconnectWS(true);
    }
  });

  autoModeToggle.addEventListener("change", (e) => {
    if (e.target.checked) {
      if (wsConnected) startAutoFrameLoop();
    } else {
      stopAutoFrameLoop();
    }
  });

  // 页面隐藏时，暂停帧发送和心跳，避免后台浪费
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      stopAutoFrameLoop();
      stopHeartbeatLoop();
    } else {
      if (wsConnected) {
        if (autoModeToggle.checked) startAutoFrameLoop();
        startHeartbeatLoop();
      }
    }
  });

  // ======== 统一日志系统（PerfLogSpec） ========
  const PerfLogger = (() => {
    const runId = `${new Date().toISOString().replace(/[:.]/g, '-')}_iphone_v${PROTOCOL_VERSION.replace(/\./g, '_')}`;
    const buffer = [];
    let flushTimer = null;

    function logEvent(eventData) {
      const log = {
        ts: new Date().toISOString(),
        protocol_version: PROTOCOL_VERSION,
        event: eventData.event,
        network: eventData.network || { rtt_ms: 0 },
        infer: eventData.infer || { total_ms: 0 },
        extra: {
          platform: /iPhone|iPad|iPod/.test(navigator.userAgent) ? "ios" : 
                   /Android/.test(navigator.userAgent) ? "android" : "web"
        }
      };

      if (eventData.frame_id !== undefined) log.frame_id = eventData.frame_id;
      if (eventData.code) log.extra.error_code = eventData.code;
      if (eventData.message) log.extra.error_message = eventData.message;

      buffer.push(log);

      // 每 3 秒或缓冲区达到 50 条时刷新
      if (buffer.length >= 50) {
        flush();
      } else if (!flushTimer) {
        flushTimer = setTimeout(flush, 3000);
      }
    }

    async function flush() {
      if (flushTimer) {
        clearTimeout(flushTimer);
        flushTimer = null;
      }
      if (!buffer.length) return;

      const batch = buffer.splice(0, buffer.length);
      try {
        const resp = await fetch(`${window.location.protocol}//${SERVER_HOST}:${SERVER_PORT}/perf_log`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ run_id: runId, records: batch })
        });
        if (!resp.ok) {
          console.warn("perf_log flush failed", resp.status);
          buffer.unshift(...batch); // 重新加入队列
        }
      } catch (e) {
        console.warn("perf_log flush failed", e);
        buffer.unshift(...batch); // 重新加入队列
      }
    }

    // 页面卸载时强制刷新
    window.addEventListener("beforeunload", flush);

    return { logEvent, runId };
  })();

  // 初始化日志
  appendLog("页面已加载，请点击「连接服务器」开始测试。");
  appendLog(`协议版本: ${PROTOCOL_VERSION}`);
</script>
</body>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Luna Badge 实时 YOLO11 测试</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background:#050816; color:#eee; }
    .layout { display:flex; flex-direction:column; gap:8px; padding:8px; }
    video, canvas { width:100%; max-height:50vh; background:#000; border-radius:8px; }
    .row { display:flex; gap:8px; }
    .row > div { flex:1; }
    button { padding:8px 12px; border-radius:6px; border:none; font-size:14px; cursor: pointer; }
    #startBtn { background:#16a34a; color:#fff; }
    #stopBtn { background:#991b1b; color:#fff; }
    button:disabled { opacity:0.5; cursor: not-allowed; }
    #status { font-size:12px; }
    .metric { font-size:12px; line-height:1.4; }
    #log { font-size:11px; max-height:120px; overflow:auto; background:#020617; padding:6px; border-radius:6px; }
    .pill { display:inline-block; padding:2px 6px; border-radius:999px; font-size:11px; margin-right:4px; }
    .pill.ok { background:#16a34a33; color:#bbf7d0; }
    .pill.bad { background:#b91c1c33; color:#fecaca; }
  </style>
</head>
<body>
<div class="layout">
  <div class="row">
    <div>
      <video id="video" playsinline muted></video>
    </div>
    <div>
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <div class="row">
    <div>
      <button id="startBtn">开始连续导航（200ms 一帧）</button>
      <button id="stopBtn" disabled>停止</button>
      <div id="status">状态：未连接</div>
      <div id="net" class="metric"></div>
    </div>
    <div>
      <div class="metric" id="perf"></div>
      <div class="metric" id="last"></div>
    </div>
  </div>

  <div id="log"></div>
</div>

<script>
// ===== 性能日志记录器 =====
const PerfLogger = (() => {
  const runId = `${new Date().toISOString().replace(/[:.]/g, '-')}_iphone_y11t`;
  const buffer = [];
  let seq = 0;

  function logFrame(frameLog) {
    buffer.push({
      type: "frame",
      ...frameLog
    });
  }

  function logEvent(ev) {
    buffer.push({
      type: "event",
      ...ev
    });
  }

  // 定时批量上报
  async function flush() {
    if (!buffer.length) return;
    const batch = buffer.splice(0, buffer.length);
    try {
      const resp = await fetch("/perf_log", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({run_id: runId, records: batch})
      });
      if (!resp.ok) {
        console.warn("perf_log flush failed", resp.status);
        buffer.unshift(...batch); // 失败就放回去
      }
    } catch (e) {
      console.warn("perf_log flush failed", e);
      buffer.unshift(...batch);
    }
  }

  setInterval(flush, 3000); // 3秒刷一次

  return {
    runId,
    nextSeq: () => ++seq,
    logFrame,
    logEvent
  };
})();

(function () {
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const startBtn = document.getElementById("startBtn");
  const stopBtn = document.getElementById("stopBtn");
  const statusEl = document.getElementById("status");
  const netEl = document.getElementById("net");
  const perfEl = document.getElementById("perf");
  const lastEl = document.getElementById("last");
  const logEl = document.getElementById("log");

  let ws = null;
  let sending = false;
  let frameTimer = null;
  let heartbeatTimer = null;
  let frameId = 0;
  const inflight = new Map(); // frame_id -> {seq, ts_client_capture, ts_client_send, client: {...}}

  function log(msg) {
    const t = new Date().toISOString().substr(11, 8);
    logEl.textContent = `[${t}] ${msg}\n` + logEl.textContent;
  }

  function setStatus(text, ok=true) {
    statusEl.innerHTML = `状态：<span class="pill ${ok ? "ok" : "bad"}">${text}</span>`;
  }

  function formatMs(ms) {
    return ms.toFixed(1) + " ms";
  }

  function connectWS() {
    if (ws && ws.readyState === WebSocket.OPEN) return;

    const proto = location.protocol === "https:" ? "wss" : "ws";
    const url = `${proto}://${location.host}/ws_json`;
    log(`连接 WebSocket: ${url}`);
    ws = new WebSocket(url);

    ws.onopen = () => {
      setStatus("已连接", true);
      log("WebSocket 已连接");
      startHeartbeat();
    };

    ws.onclose = () => {
      setStatus("已断开", false);
      log("WebSocket 断开，3 秒后重连...");
      stopHeartbeat();
      setTimeout(connectWS, 3000);
    };

    ws.onerror = (e) => {
      setStatus("错误", false);
      log("WebSocket 错误: " + e.message);
    };

    ws.onmessage = (ev) => {
      try {
        const data = JSON.parse(ev.data);
        if (data.type === "pong") {
          const now = performance.now();
          const rtt = now - data.ts_client;
          netEl.innerHTML = `心跳 RTT：${formatMs(rtt)}（网络+服务器）`;
          // 记录 RTT 事件
          PerfLogger.logEvent({
            run_id: PerfLogger.runId,
            event_id: `rtt_${now}`,
            ts: now,
            type: "network_rtt",
            level: "INFO",
            meta: {rtt_ms: rtt}
          });
          return;
        }
        if (data.type === "result") {
          const fid = data.frame_id;
          const rec = inflight.get(fid);
          if (rec) {
            inflight.delete(fid);
            const tRecv = performance.now();
            const tRender = tRecv; // 渲染时间（简化）
            
            const endToEnd = tRecv - rec.ts_client_send;
            const upload = (data.ts_server_start_ms / 1000.0) - rec.ts_client_send;
            const download = tRecv - (data.ts_server_end_ms / 1000.0);
            
            // 构建完整的 frame log
            const frameLog = {
              run_id: PerfLogger.runId,
              frame_id: fid,
              seq: rec.seq,
              ts_client_capture: rec.ts_client_capture,
              ts_client_send: rec.ts_client_send,
              ts_server_recv: data.ts_server_start_ms / 1000.0,
              ts_server_det_done: data.ts_server_det_done_ms / 1000.0,
              ts_server_send: data.ts_server_end_ms / 1000.0,
              ts_client_recv: tRecv / 1000.0,
              ts_client_render: tRender / 1000.0,
              
              client: rec.client,
              network: {
                upload_ms: upload,
                download_ms: download,
                rtt_ms: upload + download
              },
              server: data.server_log || {},
              end_to_end_ms: endToEnd,
              image_bytes: data.image_bytes || 0,
              det_count: (data.detections || []).length,
              detections: data.detections || [],
              nav: data.nav || null,
              flags: data.flags || {}
            };
            
            PerfLogger.logFrame(frameLog);
            
            lastEl.textContent = `最近一帧：端到端 ${formatMs(endToEnd)}，服务器推理 ${formatMs(data.det_ms)}，总计 ${formatMs(data.total_ms || endToEnd)}`;
          }
          drawDetections(data);
        }
      } catch (err) {
        log("解析消息失败: " + err);
      }
    };
  }

  function startHeartbeat() {
    if (heartbeatTimer) return;
    heartbeatTimer = setInterval(() => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: "ping", ts: performance.now() }));
    }, 5000);
  }

  function stopHeartbeat() {
    if (heartbeatTimer) {
      clearInterval(heartbeatTimer);
      heartbeatTimer = null;
    }
  }

  async function startCamera() {
    if (video.srcObject) return;

    // 检查是否支持 getUserMedia
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      const errorMsg = "iOS Safari 需要 HTTPS 才能访问摄像头。\n\n当前使用 HTTP，请使用 HTTPS 访问。\n\n解决方案：\n1. 使用 HTTPS 访问（需要配置 SSL 证书）\n2. 或在 Mac 上使用 localhost 测试";
      alert(errorMsg);
      log("getUserMedia 不可用: iOS Safari 需要 HTTPS");
      throw new Error("getUserMedia not available - HTTPS required");
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" },
        audio: false,
      });
      video.srcObject = stream;
      await video.play();
      canvas.width = 640;
      canvas.height = 480;
      log("摄像头已打开");
    } catch (err) {
      let errorMsg = "无法打开摄像头：";
      if (err.name === "NotAllowedError") {
        errorMsg += "请允许浏览器访问摄像头权限";
      } else if (err.name === "NotFoundError") {
        errorMsg += "未找到摄像头设备";
      } else if (err.name === "NotReadableError") {
        errorMsg += "摄像头被其他应用占用";
      } else if (location.protocol === "http:" && location.hostname !== "localhost") {
        errorMsg += "iOS Safari 需要 HTTPS 才能访问摄像头。请使用 HTTPS 访问。";
      } else {
        errorMsg += err.message;
      }
      alert(errorMsg);
      log("getUserMedia 失败: " + err.name + " - " + err.message);
      throw err;
    }
  }

  function stopCamera() {
    if (video.srcObject) {
      video.srcObject.getTracks().forEach(t => t.stop());
      video.srcObject = null;
    }
  }

  function sendFrame() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    if (!video.srcObject) return;

    const seq = PerfLogger.nextSeq();
    const fid = String(++frameId);
    
    // 客户端埋点
    const tCapStart = performance.now();
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const tCapEnd = performance.now();
    
    const tEncStart = performance.now();
    const dataUrl = canvas.toDataURL("image/jpeg", 0.4);
    const tEncEnd = performance.now();
    
    const tSend = performance.now();
    const imgB64 = dataUrl.split(",")[1];
    
    // 记录发送前的信息
    inflight.set(fid, {
      seq,
      frame_id: fid,
      ts_client_capture: tCapStart / 1000.0,
      ts_client_send: tSend / 1000.0,
      client: {
        capture_ms: tCapEnd - tCapStart,
        encode_ms: tEncEnd - tEncStart,
        pack_ms: tSend - tEncEnd
      }
    });

    const payload = {
      type: "frame",
      frame_id: fid,
      seq: seq,
      run_id: PerfLogger.runId,
      ts_client: tSend,
      image: imgB64,
    };
    ws.send(JSON.stringify(payload));
  }

  function startSendLoop() {
    if (frameTimer) return;
    sending = true;
    frameTimer = setInterval(() => {
      if (!sending) return;
      sendFrame();
    }, 200); // 200ms 一帧
    setStatus("运行中", true);
    perfEl.textContent = "目标：端到端 < 250ms";
  }

  function stopSendLoop() {
    sending = false;
    if (frameTimer) {
      clearInterval(frameTimer);
      frameTimer = null;
    }
    setStatus("已停止", false);
  }

  function drawDetections(data) {
    // 先画原始帧
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const dets = data.detections || [];
    ctx.strokeStyle = "#22c55e";
    ctx.lineWidth = 2;
    ctx.font = "12px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    dets.forEach(d => {
      const [x1, y1, x2, y2] = d.bbox;
      const w = x2 - x1;
      const h = y2 - y1;
      ctx.strokeRect(x1, y1, w, h);
      const label = `${d.cls} ${(d.conf * 100).toFixed(1)}%`;
      const tw = ctx.measureText(label).width + 4;
      const th = 14;
      ctx.fillRect(x1, y1 - th, tw, th);
      ctx.fillStyle = "#e5e7eb";
      ctx.fillText(label, x1 + 2, y1 - 3);
      ctx.fillStyle = "rgba(0,0,0,0.6)";
    });
  }

  startBtn.onclick = async () => {
    try {
      await startCamera();
      connectWS();
      startSendLoop();
      startBtn.disabled = true;
      stopBtn.disabled = false;
    } catch (_) {}
  };

  stopBtn.onclick = () => {
    stopSendLoop();
    stopCamera();
    startBtn.disabled = false;
    stopBtn.disabled = true;
  };

  // 页面加载后先建立 WS，用户点开始时打开摄像头
  connectWS();
})();
</script>
</body>
</html>

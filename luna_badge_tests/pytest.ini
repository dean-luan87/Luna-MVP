[pytest]
# pytest 配置文件

# Python 路径：指向主项目目录
pythonpath = /Users/luanlei/Desktop/Luna-2/luna_badge_v1_2

# 测试发现模式
testpaths = tests standalone_tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出选项
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    e2e: 端到端测试
    slow: 慢速测试
    v1_4_4: v1.4.4 版本测试
    v1_4_5: v1.4.5 版本测试
    v1_4_5a: v1.4.5a 版本测试
    v1_4_7: v1.4.7 版本测试












